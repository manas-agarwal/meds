<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homeopathic Medicines Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Homeopathic Medicines Inventory</h1>

    <p id="message" role="alert" hidden></p>

    <input id="search" type="search" placeholder="Search by name..." aria-label="Search by name">

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Potency</th>
            <th>Quantity (ml)</th>
            <th>Location</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script>
    // Read-only view: loads data/medicines.json and filters by name. Nothing is saved.
    let medicines = [];
    const $ = (id) => document.getElementById(id);

    function showMessage(text) {
      $("message").textContent = text;
      $("message").className = "error";
      $("message").hidden = !text;
    }

    function render() {
      const term = $("search").value.trim().toLowerCase();
      const rows = medicines.filter((m) => String(m.name).toLowerCase().includes(term));
      const tbody = $("rows");
      tbody.textContent = "";

      if (!rows.length) {
        const td = document.createElement("td");
        td.colSpan = 4;
        td.className = "empty";
        td.textContent = medicines.length ? "No medicines match your search." : "No medicines to show.";
        tbody.appendChild(document.createElement("tr")).appendChild(td);
        return;
      }
      rows.forEach((m) => {
        const tr = document.createElement("tr");
        [m.name, m.potency, m.quantity, m.location].forEach((value) => {
          const td = document.createElement("td");
          td.textContent = value; // textContent, never innerHTML
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    async function load() {
      try {
        const res = await fetch("data/medicines.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error("the file must contain a JSON array");
        medicines = data;
      } catch (e) {
        showMessage(location.protocol === "file:"
          ? "This page was opened as a file, so the browser blocked loading data/medicines.json. Open it through IIS or a local static server (e.g. python -m http.server)."
          : "Could not load data/medicines.json (" + e.message + ").");
      }
      render();
    }

    $("search").addEventListener("input", render);
    load();
  </script>
</body>
</html>
